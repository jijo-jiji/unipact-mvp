# Render Blueprint for the UniPact API (https://render.com/docs/blueprint-spec)
# Render dashboard > New > Blueprint > pick this repo. Values marked "sync: false" are asked for once
# in the dashboard and never stored in the repo. See DEPLOYMENT.md for what goes in each one.
services:
  - type: web
    name: unipact-api
    runtime: python
    region: singapore
    # Starter keeps the API awake and gives you a Shell for create_admin; the free plan sleeps after 15 min idle
    plan: starter
    branch: master
    rootDir: unipact-backend
    buildCommand: bash build.sh
    startCommand: gunicorn unipact_backend.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --timeout 120 --access-logfile -
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.1
      - key: DJANGO_ENV
        value: production
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: api.unipact.my
      - key: DJANGO_ADMIN_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://app.unipact.my
      - key: AUTH_COOKIE_DOMAIN
        value: .unipact.my
      - key: AUTH_COOKIE_SAMESITE
        value: Lax
      - key: FRONTEND_URL
        value: https://app.unipact.my
      - key: DEFAULT_PLATFORM_FEE_PERCENT
        value: "10"
      - key: NUM_PROXIES
        value: "1"
      # PostgreSQL (Neon): the full postgres://... connection string
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL_REQUIRE
        value: "true"
      # Uploads (Cloudflare R2)
      - key: USE_S3
        value: "true"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        value: unipact-uploads
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        value: auto
      # Email (Gmail app password to start; see DEPLOYMENT.md)
      - key: EMAIL_HOST
        value: smtp.gmail.com
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SENTRY_DSN
        sync: false
      # ToyyibPay (FPX). Both accounts' keys are kept; TOYYIBPAY_MODE (sandbox | live) picks one.
      # Leave the keys empty to keep bank-transfer-only billing
      - key: TOYYIBPAY_MODE
        value: sandbox
      - key: TOYYIBPAY_SANDBOX_SECRET_KEY
        sync: false
      - key: TOYYIBPAY_SANDBOX_CATEGORY_CODE
        sync: false
      - key: TOYYIBPAY_LIVE_SECRET_KEY
        sync: false
      - key: TOYYIBPAY_LIVE_CATEGORY_CODE
        sync: false
      - key: TOYYIBPAY_SANDBOX_TESTERS
        sync: false
      - key: API_PUBLIC_URL
        value: https://api.unipact.my
