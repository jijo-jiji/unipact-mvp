<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0B1E63" />
  <title>UniPact | You're offline</title>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
           background: #F5F7FC; color: #0A1748; font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
    main { max-width: 360px; text-align: center; }
    img { width: 72px; height: 72px; border-radius: 16px; }
    h1 { font-family: Outfit, Inter, system-ui, sans-serif; font-size: 1.6rem; margin: 20px 0 8px; }
    p { color: #5B6478; line-height: 1.6; margin: 0 0 24px; }
    button { background: #00AEEF; color: #0A1748; border: 0; border-radius: 8px; padding: 12px 20px; font-weight: 700;
             font-size: 1rem; cursor: pointer; }
    button:hover { background: #0090C6; color: #fff; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="UniPact" />
    <h1>You're offline</h1>
    <p>UniPact needs an internet connection to load your projects and campus. Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
